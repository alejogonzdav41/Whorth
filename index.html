<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <meta name="description" content="WHY BOTHER? – Una experiencia de simulación interactiva">
    <title>WHY BOTHER?</title>
    <link rel="stylesheet" href="style.css">
    <script src="main.js" defer></script>
  </head>
  <body>
    <main>
      <!-- FASE 1: Minimalista, Blanco y Negro con Formas Geométricas -->
      <section class="simple-screen" id="simple-screen" aria-label="Primera fase">
        <div class="shapes-container" id="shapes-container">
          <button class="geo-shape shape-circle" data-shape="circle" aria-label="Círculo"></button>
          <button class="geo-shape shape-square" data-shape="square" aria-label="Cuadrado"></button>
          <button class="geo-shape shape-triangle" data-shape="triangle" aria-label="Triángulo"></button>
        </div>
        <div class="minimal-output" id="minimal-output" aria-live="polite"></div>

        <!-- Pregunta que aparece de la nada -->
        <div class="question-overlay" id="question-overlay" hidden>
          <h1 class="question-text">¿Podríamos hacer que esto valga la pena?</h1>
          <div class="choice-actions" id="choice-actions">
            <button class="choice-btn" id="choose-yes" type="button">SÍ</button>
            <button class="choice-btn" id="choose-no" type="button">NO</button>
          </div>
          <div class="extra-time" id="extra-time" hidden>
            <span id="countdown">45</span>
          </div>
        </div>

        <div class="transition-curtain" aria-hidden="true"></div>
      </section>

      <!-- FASE 2: Universo Generativo y Partículas Adaptativas -->
      <section class="discovery-screen" id="discovery-screen" aria-label="Experiencia interactiva colorida">
        <canvas id="simulation"></canvas>
        <div class="subtle-hint" aria-hidden="true">
          Las posibilidades aparecen cuando decides explorar.
        </div>
      </section>
    </main>
  </body>
</html>
